name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npx --yes npm@11 ci
      - run: npm run check
      - run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait
      - name: Smoke test through the proxy
        run: |
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/api/openapi.json > /dev/null
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-user","email":"ci@example.com","password":"ci-password-123"}' > /dev/null
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -d 'username=ci-user&password=ci-password-123' | grep -q access_token
      - name: Logs on failure
        if: failure()
        run: docker compose logs
